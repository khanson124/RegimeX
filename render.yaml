# RegimeX — Render Blueprint
# https://render.com/docs/blueprint-spec
#
# Deploy: connect this repo in Render → New → Blueprint → select render.yaml
# Before first deploy: set JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, and
# CREDENTIAL_ENCRYPTION_KEY in the Render dashboard (sync: false vars below).

databases:
  - name: regimex-db
    plan: starter
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: regimex-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: regimex-api
    runtime: docker
    plan: starter
    dockerfilePath: ./docker/Dockerfile.api
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: regimex-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: regimex-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: DEMO_TRADING_ENABLED
        value: "false"
      - key: SEED_ON_START
        value: "true"
      - key: SEED_MOCK_CANDLES
        value: "false"
      - key: SEED_DEV_USER
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false

  - type: worker
    name: regimex-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./docker/Dockerfile.worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: regimex-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: regimex-redis
          property: connectionString
      - key: DEMO_TRADING_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
